plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}"
base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xmaxerrs' << '9999'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Forge Config API Port'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
    maven {
        // NeoForge's config API, a dependency of Forge Config API Port
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

sourceSets {
    // Development test scene (screenshots and checks), a separate mod in dev runs; not in the jar
    scene {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        evilcraft {
            sourceSet sourceSets.main
        }
        evilcraft_scene {
            sourceSet sourceSets.scene
        }
    }
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run-server'
        }
        scene {
            client()
            name 'Scene'
            source sourceSets.scene
            vmArg '-Devilcraft.scene=true'
            vmArg "-Devilcraft.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir 'run'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "maven.modrinth:cyclops-core:${cyclopscore_modrinth_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'junit:junit:4.13.2'
}

// Strip the lambdas of client-only methods on servers too (see buildSrc/ClientLambdaStripping)
tasks.named('compileJava') {
    doLast {
        int changed = ClientLambdaStripping.process(destinationDirectory.get().asFile)
        logger.info("Marked client lambdas in ${changed} classes")
    }
}

processResources {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_author: mod_author,
            description: description, license: license, display_url: display_url, github_url: github_url,
            issue_tracker_url: issue_tracker_url, mod_credits: mod_credits, minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version, fabric_version: fabric_version,
            cyclopscore_version: cyclopscore_version, forgeconfigapiport_version: forgeconfigapiport_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
    from('licenses') { into "licenses/${mod_id}" }
}

// Production runs (tools/prodtest.sh): Minecraft with intermediary names, as players have it. The release jar on a
// real Fabric server; the release jar plus the scene mod (remapped) on a production client
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    productionMods "maven.modrinth:cyclops-core:${cyclopscore_modrinth_version}"
}
var sceneJar = tasks.register('sceneJar', Jar) {
    from sourceSets.scene.output
    archiveClassifier = 'scene-dev'
}
var remapSceneJar = tasks.register('remapSceneJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = sceneJar.flatMap { it.archiveFile }
    archiveClassifier = 'scene'
    addNestedDependencies = false
    // The scene calls inherited Minecraft methods on classes of the mod: the remapper needs their hierarchy
    classpath.from(sourceSets.main.output)
}
tasks.register('prodScene', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.setFrom(tasks.named('remapJar'), remapSceneJar, configurations.productionMods)
    jvmArgs.add('-Devilcraft.scene=true')
    runDir = file('run-prod')
}
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.setFrom(tasks.named('remapJar'), configurations.productionMods)
    runDir = file('run-prod-server')
}
