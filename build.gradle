plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// evilcraft-fabric-<version>+<minecraft>.jar, as the other ports (the upload script reads both from the name)
version = "${mod_version}+${minecraft_version}"
base {
    archivesName = "${mod_id}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xmaxerrs' << '9999'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Forge Config API Port'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
    maven {
        // NeoForge's config API, a dependency of Forge Config API Port
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

sourceSets {
    // Development test scene (screenshots and checks), a separate mod in dev runs; not in the jar
    scene {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // The GameTests of the original (Fabric GameTest API), a separate mod in the gametest run; not in the jar
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        evilcraft {
            sourceSet sourceSets.main
        }
        evilcraft_scene {
            sourceSet sourceSets.scene
        }
        evilcraft_gametest {
            sourceSet sourceSets.gametest
        }
    }
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run-server'
        }
        scene {
            client()
            name 'Scene'
            source sourceSets.scene
            vmArg '-Devilcraft.scene=true'
            vmArg "-Devilcraft.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir 'run'
        }
        // ./gradlew runPerf (tools/perf.sh): the stress test of src/scene (PerfScene); -Pjfr records run/perf.jfr
        perf {
            client()
            name 'Perf'
            source sourceSets.scene
            vmArg '-Devilcraft.perf=true'
            if (project.hasProperty('jfr')) {
                vmArg "-XX:StartFlightRecording=filename=${file('run/perf.jfr')},settings=profile"
            }
            runDir 'run'
        }
        // ./gradlew runGametest (tools/gametest.sh): a server that runs all GameTests on start, then exits
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest/junit.xml')}"
            runDir 'run-gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.x: no obfuscation, no mappings, plain configurations (no mod* ones)
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "maven.modrinth:cyclops-core:${cyclopscore_modrinth_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Optional integrations of EvilCraft-Compat (bundled into EvilCraft by the original): JEI and Jade
    compileOnly "maven.modrinth:jei:${jei_modrinth_version}"
    compileOnly "maven.modrinth:jade:${jade_modrinth_version}"
    if (!project.hasProperty('no_compat_runtime')) {
        localRuntime "maven.modrinth:jei:${jei_modrinth_version}"
        // JEI on Fabric needs MezzConfig (players install it with JEI)
        localRuntime "maven.modrinth:mezzconfig:${mezzconfig_modrinth_version}"
        localRuntime "maven.modrinth:jade:${jade_modrinth_version}"
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'junit:junit:4.13.2'
}

// Strip the lambdas of client-only methods on servers too (see buildSrc/ClientLambdaStripping)
tasks.named('compileJava') {
    doLast {
        int changed = ClientLambdaStripping.process(destinationDirectory.get().asFile)
        logger.info("Marked client lambdas in ${changed} classes")
    }
}

processResources {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_author: mod_author,
            description: description, license: license, display_url: display_url, github_url: github_url,
            issue_tracker_url: issue_tracker_url, mod_credits: mod_credits, minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version, fabric_version: fabric_version,
            cyclopscore_version: cyclopscore_version, forgeconfigapiport_version: forgeconfigapiport_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
    from('licenses') { into "licenses/${mod_id}" }
}

// Production runs (tools/prodtest.sh): the release jar on a real Fabric server; the release jar plus the scene mod on a
// production client. 26.x has no remapping: the jars of the jar tasks are what players get
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    productionMods "maven.modrinth:cyclops-core:${cyclopscore_modrinth_version}"
}
var sceneJar = tasks.register('sceneJar', Jar) {
    from sourceSets.scene.output
    archiveClassifier = 'scene'
}
tasks.register('prodScene', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.setFrom(tasks.named('jar'), sceneJar, configurations.productionMods)
    jvmArgs.add('-Devilcraft.scene=true')
    runDir = file('run-prod')
}
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.setFrom(tasks.named('jar'), configurations.productionMods)
    runDir = file('run-prod-server')
}
