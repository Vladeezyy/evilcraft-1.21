plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}"
base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xmaxerrs' << '9999'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Forge Config API Port'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
    maven {
        // NeoForge's config API, a dependency of Forge Config API Port
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run-server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "maven.modrinth:cyclops-core:${cyclopscore_modrinth_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'junit:junit:4.13.2'
}

processResources {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_author: mod_author,
            description: description, license: license, display_url: display_url, github_url: github_url,
            issue_tracker_url: issue_tracker_url, mod_credits: mod_credits, minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version, fabric_version: fabric_version,
            cyclopscore_version: cyclopscore_version, forgeconfigapiport_version: forgeconfigapiport_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${mod_name}" }
    }
}
