# Build on every push and pull request, then the server tests: the dev server on a fresh world (tools/servertest.sh),
# the GameTests of the original (tools/gametest.sh) and the release jar on a production Fabric server
# (tools/prodtest.sh). The jars, the logs and the GameTest report are kept as artifacts.
name: Build

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --console=plain

      - name: Dev server starts
        run: sh tools/servertest.sh

      - name: GameTests
        run: sh tools/gametest.sh

      - name: Production server starts (release jar)
        run: SERVER_ONLY=1 sh tools/prodtest.sh

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/servertest.log
            build/gametest.log
            build/gametest/junit.xml
            build/prodserver.log
          if-no-files-found: ignore

      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: ignore
